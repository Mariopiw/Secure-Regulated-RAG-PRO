[project]
name = "secure-regulated-rag-pro"
version = "1.0.0"
description = "Production-oriented secure RAG reference implementation for regulated workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]>=0.37,<1",
  "sqlalchemy[asyncio]==2.0.54",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pgvector==0.5.0",
  "pydantic-settings==2.15.0",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "httpx==0.28.1",
  "pypdf>=6.0,<7",
  "python-docx>=1.2,<2",
  "prometheus-client>=0.22,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.13,<1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
